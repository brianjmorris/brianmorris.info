# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy live website
on:
  push:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: firebase-production
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run build
      - run: npm --prefix functions run lint
      - run: npm --prefix functions test
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRIAN_MORRIS }}
          project_id: brian-morris
      - name: Deploy live function and Hosting
        run: npx --yes firebase-tools@15.34.1 deploy --only functions:app,hosting --project brian-morris --non-interactive
